<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL Maintenance Hub</title>
    <style>
        :root {
            --bg-main: #0d1117;       /* Deep dark background */
            --bg-sidebar: #161b22;    /* Slate dark sidebar */
            --bg-code: #010409;       /* High-contrast pure black codeblocks */
            --text-main: #c9d1d9;     /* Soft white text */
            --text-muted: #8b949e;    /* Muted gray info text */
            --accent: #58a6ff;        /* Vibrant developer blue */
            --accent-hover: #1f6feb;  /* Darker blue hover states */
            --success: #238636;       /* Clean green for active confirmation */
            --border: #30363d;        /* Subtle divider borders */
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Sidebar Styling */
        nav {
            width: 280px;
            height: 100vh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            position: fixed;
            overflow-y: auto;
            padding: 25px 20px;
            box-sizing: border-box;
        }
        nav h2 { 
            font-size: 0.85rem; 
            margin-top: 0; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
            margin-bottom: 15px;
        }
        nav ul { list-style: none; padding: 0; margin: 0; }
        nav li { margin-bottom: 8px; }
        nav a { 
            text-decoration: none; 
            color: var(--text-main); 
            font-size: 0.95rem; 
            display: block;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        nav a:hover { 
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent); 
        }
        
        /* Main Workspace Layout */
        main {
            margin-left: 280px;
            padding: 50px;
            max-width: 900px;
            width: 100%;
            box-sizing: border-box;
        }
        h1 { 
            font-size: 2rem;
            color: #ffffff;
            margin-top: 0; 
            margin-bottom: 5px;
        }
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 40px;
            font-size: 1rem;
        }
        section { 
            margin-bottom: 45px; 
            scroll-margin-top: 40px; 
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 24px;
        }
        section h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 1.3rem;
        }
        
        /* Monospaced Code Blocks */
        .code-container {
            position: relative;
            background: var(--bg-code);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-top: 15px;
        }
        pre {
            margin: 0;
            padding: 18px;
            overflow-x: auto;
            color: #e6edf3;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.9rem;
        }
        
        /* Copy Action Button */
        .copy-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .copy-btn:hover { 
            background: var(--border);
            border-color: var(--text-muted);
        }
        
        /* Async Loading States */
        .loading { 
            color: var(--text-muted); 
            font-style: italic; 
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Menu -->
    <nav>
        <h2>Maintenance Scripts</h2>
        <ul id="sidebar-links">
            <li class="loading">Loading indexes...</li>
        </ul>
    </nav>

    <!-- Main Container Layout -->
    <main>
        <h1 id="top">PostgreSQL Maintenance Hub</h1>
        <p class="subtitle">Dynamic runtime dashboard compiling shared maintenance profiles directly out of Git versioning storage.</p>
        
        <div id="snippets-container">
            <p class="loading">Establishing secure connection to repository file streams...</p>
        </div>
    </main>

    <!-- Content Engine -->
    <script>
        const sidebar = document.getElementById('sidebar-links');
        const container = document.getElementById('snippets-container');

        async function fetchRepoFiles() {
            try {
                // FIXED: Direct plain text connection link targeting the unblocked data API channel
                const response = await fetch("https://github.com");
                if (!response.ok) throw new Error("Directory target mapping failure.");
                const files = await response.json();

                sidebar.innerHTML = "";
                container.innerHTML = "";

                const targetFiles = files.filter(f => f.type === 'file');

                if (targetFiles.length === 0) {
                    container.innerHTML = `<p class="subtitle">Empty script layout. Drop .sql files directly into the "scripts/" directory to populate.</p>`;
                    return;
                }

                // Sequence read individual file text payloads
                for (const [index, file] of targetFiles.entries()) {
                    const contentResponse = await fetch(file.download_url);
                    const fileText = await contentResponse.text();
                    
                    // Humanize names: "update_fop_staging_to_dev.sql" -> "Update Fop Staging To Dev"
                    const cleanName = file.name.replace(/^\d+_/,'').replace(/\.[^/.]+\$/, '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                    const sectionId = `snippet-${index}`;

                    // Update Navigation Component
                    const li = document.createElement('li');
                    li.innerHTML = `<a href="#${sectionId}">${cleanName}</a>`;
                    sidebar.appendChild(li);

                    // Update Document Node Components
                    const section = document.createElement('section');
                    section.id = sectionId;
                    section.innerHTML = `
                        <h2>${cleanName}</h2>
                        <span style="color:var(--text-muted); font-size:0.8rem; font-family:monospace;">Origin Source: scripts/${file.name}</span>
                        <div class="code-container">
                            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                            <pre><code>${escapeHtml(fileText)}</code></pre>
                        </div>
                    `;
                    container.appendChild(section);
                }

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color:#ff7b72;">Failed to render target files dynamically. Verify your directory paths or API connections.</p>`;
            }
        }

        function copyCode(button) {
            const codeBlock = button.nextElementSibling.querySelector('code');
            navigator.clipboard.writeText(codeBlock.textContent).then(() => {
                button.textContent = "✔ Copied!";
                button.style.backgroundColor = "#238636";
                button.style.borderColor = "#238636";
                button.style.color = "#ffffff";
                setTimeout(() => { 
                    button.textContent = "Copy"; 
                    button.style.backgroundColor = ""; 
                    button.style.borderColor = "";
                    button.style.color = "";
                }, 1800);
            }).catch(err => {
                const textarea = document.createElement('textarea');
                textarea.value = codeBlock.textContent;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                
                button.textContent = "✔ Copied!";
                button.style.backgroundColor = "#238636";
                setTimeout(() => { button.textContent = "Copy"; button.style.backgroundColor = ""; }, 1800);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        fetchRepoFiles();
    </script>
</body>
</html>
