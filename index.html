<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostgreSQL Maintenance Hub</title>
    <!-- Lightweight Prism.js Dark Theme for High-Contrast SQL Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
        :root {
            --bg-main: #0b0d10;        /* Premium deep black background */
            --bg-sidebar: #12161a;     /* Soft charcoal slate sidebar */
            --bg-card: #181d24;        /* Monolithic code container background */
            --text-main: #e1e7ed;      /* Bright readable developer font contrast */
            --text-muted: #798896;     /* Subdued description grey */
            --accent: #ff7a00;         /* Modern developer orange accent */
            --border: #222933;         /* Crisp geometric panel dividers */
            --search-bg: #1a212a;      /* Deep inset input lane background */
            --success: #1fa636;        /* Slate green verification banner text */
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* Sidebar & Search Interface Architecture */
        nav {
            width: 300px;
            height: 100vh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            position: fixed;
            overflow-y: auto;
            padding: 25px 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        nav h1 {
            font-size: 1.1rem;
            margin: 0 0 5px 5px;
            color: #ffffff;
            font-weight: 600;
        }
        .search-wrapper {
            margin-bottom: 25px;
            padding: 0 5px;
        }
        .search-bar {
            width: 100%;
            background: var(--search-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 0.9rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-bar:focus {
            border-color: var(--accent);
        }
        
        /* Category Tree Component System */
        .menu-wrapper {
            flex: 1;
            overflow-y: auto;
        }
        .category-group {
            margin-bottom: 20px;
        }
        .category-title {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            padding: 5px 10px;
            margin: 0;
        }
        nav ul { list-style: none; padding: 0; margin: 5px 0 0 0; }
        nav li { margin-bottom: 4px; }
        nav a { 
            text-decoration: none; 
            color: var(--text-main); 
            font-size: 0.9rem; 
            display: block;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        nav a:hover { 
            background: rgba(255, 255, 255, 0.04);
            color: #ffffff; 
        }
        nav li.active a {
            background: rgba(255, 122, 0, 0.1);
            color: var(--accent);
            font-weight: 500;
        }
        
        /* Central Document Feed Workspace */
        main {
            margin-left: 300px;
            padding: 50px 60px;
            max-width: 1000px;
            width: 100%;
            box-sizing: border-box;
        }
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 50px;
            font-size: 0.95rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }
        section { 
            margin-bottom: 40px; 
            scroll-margin-top: 40px; 
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 30px;
            transition: opacity 0.2s ease;
        }
        section h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 1.4rem;
            font-weight: 600;
        }
        
        /* Prism Highlights Overrides */
        .code-container {
            position: relative;
            margin-top: 20px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        pre[class*="language-"] {
            margin: 0 !important;
            padding: 20px !important;
            background: #07090c !important;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 0.9rem;
        }
        
        /* Action Utility Tools */
        .copy-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #1c232b;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s ease;
        }
        .copy-btn:hover { 
            background: var(--border);
            border-color: var(--text-muted);
            color: #ffffff;
        }
        
        .loading { 
            color: var(--text-muted); 
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>
<body>

    <!-- Nav Operational Core -->
    <nav>
        <h1>Maintenance Hub</h1>
        <div class="subtitle" style="margin-bottom:15px; padding-bottom:5px; border:none; font-size:0.8rem;">BCD-Power-Dev</div>
        
        <!-- Live Real-Time Document Filter Search Bar Input -->
        <div class="search-wrapper">
            <input type="text" id="search-input" class="search-bar" placeholder="Search snippets..." onkeyup="filterSnippets()">
        </div>

        <div class="menu-wrapper" id="sidebar-menu">
            <div class="loading">Loading manifest entries...</div>
        </div>
    </nav>

    <!-- Structural Workspace Display -->
    <main>
        <h2>PostgreSQL Maintenance Dashboard</h2>
        <p class="subtitle">Categorized engineering catalog pulling query profiles automatically out of repository versioning data.</p>
        
        <div id="snippets-container">
            <div class="loading">Connecting to remote directory records...</div>
        </div>
    </main>

    <!-- Prism Syntax Parsing Scripts Layer -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

    <!-- Operational Data Aggregator Controller Engine -->
    <script>
        const menuWrapper = document.getElementById('sidebar-menu');
        const container = document.getElementById('snippets-container');
        let globalSnippetRegistry = [];

        async function fetchRepoFiles() {
            try {
                // Hardcoded connection link bypassing local formatting parser constraints
                const response = await fetch("https://api.github.com/repos/BCD-Power-Dev/Postgres_Maint/contents/scripts");
                if (!response.ok) throw new Error("Directory target mapping failure.");
                const files = await response.json();

                const targetFiles = files.filter(f => f.type === 'file');

                if (targetFiles.length === 0) {
                    menuWrapper.innerHTML = "";
                    container.innerHTML = `<p class="subtitle">Empty script layout. Drop categorized .sql files into the scripts directory to populate.</p>`;
                    return;
                }

                const organizedCategories = {};

                // Process code documents sequentially
                for (const [index, file] of targetFiles.entries()) {
                    const contentResponse = await fetch(file.download_url);
                    const fileText = await contentResponse.text();
                    
                    // Parse category prefixes (e.g. FOP_Update.sql -> Category: FOP, Name: Update)
                    let category = "General";
                    let rawName = file.name;
                    
                    if (file.name.includes('_')) {
                        const fragments = file.name.split('_');
                        const potentialCategory = fragments[0].toUpperCase();
                        // Validate category isn't a simple list ordering numbering index prefix (e.g. 01_vacuum)
                        if (isNaN(potentialCategory)) {
                            category = potentialCategory;
                            rawName = fragments.slice(1).join('_');
                        }
                    }

                    const cleanName = rawName.replace(/\.[^/.]+\$/, '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
                    const sectionId = `snippet-${index}`;

                    const snippetEntry = {
                        id: sectionId,
                        name: cleanName,
                        category: category,
                        file: file.name,
                        text: fileText
                    };
                    
                    globalSnippetRegistry.push(snippetEntry);

                    if (!organizedCategories[category]) {
                        organizedCategories[category] = [];
                    }
                    organizedCategories[category].push(snippetEntry);
                }

                renderDashboard(organizedCategories);

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="color:#ff7b72;">Failed to render target files dynamically. Verify directory architecture mappings.</p>`;
            }
        }

        function renderDashboard(categories) {
            menuWrapper.innerHTML = "";
            container.innerHTML = "";

            // Loop through sorted keys to render elements beautifully
            Object.keys(categories).sort().forEach(catName => {
                // Generate Category Header UI Sidebar Element
                const catGroup = document.createElement('div');
                catGroup.className = "category-group";
                catGroup.setAttribute('data-category', catName);
                
                const catTitle = document.createElement('h2');
                catTitle.className = "category-title";
                catTitle.textContent = catName;
                catGroup.appendChild(catTitle);
                
                const ul = document.createElement('ul');

                categories[catName].forEach(snippet => {
                    // Inject list submenus into sidebar channel lanes
                    const li = document.createElement('li');
                    li.id = `nav-${snippet.id}`;
                    li.innerHTML = `<a href="#${snippet.id}" onclick="highlightNav('${snippet.id}')">${snippet.name}</a>`;
                    ul.appendChild(li);

                    // Inject functional structural card workspace frames
                    const section = document.createElement('section');
                    section.id = snippet.id;
                    section.setAttribute('data-search-content', `${snippet.name} ${snippet.category} ${snippet.text}`.toLowerCase());
                    section.innerHTML = `
                        <h2>${snippet.name}</h2>
                        <span style="color:var(--text-muted); font-size:0.8rem; font-family:monospace;">Classification: ${snippet.category} • scripts/${snippet.file}</span>
                        <div class="code-container">
                            <button class="copy-btn" onclick="copyCode(this)">Copy</button>
                            <pre class="language-sql"><code class="language-sql">${escapeHtml(snippet.text)}</code></pre>
                        </div>
                    `;
                    container.appendChild(section);
                });

                catGroup.appendChild(ul);
                menuWrapper.appendChild(catGroup);
            });

            // Trigger Prism to apply code text coloration styles globally 
            if (window.Prism) Prism.highlightAll();
        }

        // Live Real-Time Content Filtering Engine
        function filterSnippets() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const sections = container.getElementsByTagName('section');

            for (const section of sections) {
                const searchContent = section.getAttribute('data-search-content');
                const matched = searchContent.includes(query);
                
                // Toggle block layouts visibility
                section.style.display = matched ? "block" : "none";
                
                // Toggle matching navigation menu link visibility structures
                const navLink = document.getElementById(`nav-${section.id}`);
                if (navLink) navLink.style.display = matched ? "block" : "none";
            }

            // Hide entirely empty categories from view during filtering operations
            const groups = menuWrapper.getElementsByClassName('category-group');
            for (const group of groups) {
                const totalVisibleLinks = group.querySelectorAll('li[style="display: block;"], li:not([style])').length;
                group.style.display = totalVisibleLinks === 0 ? "none" : "block";
            }
        }

        function highlightNav(id) {
            const activeItems = menuWrapper.querySelectorAll('li.active');
            activeItems.forEach(item => item.classList.remove('active'));
            
            const targetLi = document.getElementById(`nav-${id}`);
            if (targetLi) targetLi.classList.add('active');
        }

        function copyCode(button) {
            const codeBlock = button.nextElementSibling.querySelector('code');
            navigator.clipboard.writeText(codeBlock.textContent).then(() => {
                button.textContent = "✔ Copied!";
                button.style.backgroundColor = "#238636";
                button.style.borderColor = "#238636";
                button.style.color = "#ffffff";
                setTimeout(() => { 
                    button.textContent = "Copy"; button.style.backgroundColor = ""; button.style.borderColor = ""; button.style.color = "";
                }, 1800);
            }).catch(err => {
                const textarea = document.createElement('textarea');
                textarea.value = codeBlock.textContent;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                button.textContent = "✔ Copied!";
                button.style.backgroundColor = "#238636";
                setTimeout(() => { button.textContent = "Copy"; button.style.backgroundColor = ""; }, 1800);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&").replace(/</g, "<").replace(/>/g, ">");
        }

        fetchRepoFiles();
    </script>
</body>
</html>
